<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2-Circle Puzzle</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin: 0;
                height: 100vh;
                font-size: 25px;
            } h3 {
                border-style: solid;
                border-width: 3px;
                border-color: #000000;
                border-radius: 10px;
                padding: 10px;
                cursor: default;
                color: #000000;
                background-color: #ffffff;
            } h3:hover {
                cursor: pointer;
                color: #ffffff;
                background-color: #000000;
            }
        </style>
        <script defer>
            let load = false;
            const scramble = function() {
                if (load) {
                    const moves = [
                        '+',
                        '++',
                        '3',
                        '-',
                        '--'
                    ];
                    let L = '';
                    let R = '';
                    const scram = [];
                    const total = ((Math.floor(Math.random() * 6) + 1) + 6) * 2;
                    let even = Math.floor(Math.random() * 2) + 1;
                    let odd = ''
                    switch (even) {
                        case 1:
                            even = 'L';
                            break;
                        case 2:
                            even = 'R';
                            break;
                        default:
                            break;
                    }
                    if (even === 'L') {
                        odd = 'R';;
                    } else {
                        if (even === 'R') {
                            odd = 'L'
                        }
                    }
                    for (let i = 0; i < total; i++) {
                        const choice = Math.floor(Math.random() * 5)
                        if ((i + 1) % 2 === 0) {
                            scram[i] = even + moves[choice]
                        } else {
                            scram[i] = odd + moves[choice]
                        }
                    }
                    document.getElementById('txt').innerHTML = scram.join(' ')
                }
            }
            document.addEventListener('DOMContentLoaded', function() {
                load = true;
                scramble();
            })
        </script>
    </head>
    <body>
        <h1 id="txt" style="text-align: center">Generating...</h1>
        <h3 onclick="scramble()">Scramble</h3>
    </body>
</html>
