<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Crustable</title>
        <link rel="icon" href="icon.png">
        <style>
            .outer {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
                box-sizing: border-box;
            }
            .inner {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                width: 100%;
                gap: 10px;
            }
            .inner h1 {
                padding: 10px;
                border-style: solid;
                border-width: 2.5px;
                border-color: black;
                background-color: white;
                color: black;
                cursor: default;
                user-select: none
            }
            .inner h1:hover {
                border-color: white;
                background-color: black;
                color: white;
                cursor: pointer;
            }
            #number {
                padding: 10px;
                font-size: 1.5rem;
                width: 60px;
                text-align: center;
                border: 2.5px solid black;
                font-weight: bold;
            }
            p {
                padding: 10px;
                border-style: solid;
                border-width: 2.5px;
                border-color: black;
                background-color: white;
                color: black;
                cursor: default;
            }
            p:hover {
                border-color: white;
                background-color: black;
                color: white;
                cursor: pointer;
            }            
            .pdf-wrapper {
                margin-top: 20px;
                border: 2.5px solid black;
                background: white;
                max-width: 100%;
                overflow: auto;
            }
            canvas {
                display: block;
                max-width: 100%;
                height: auto;
            }
        </style>        
        <script type="module">
            import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
            const pdfUrl = 'theCrucible.pdf';
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
            let pdfDoc = null;
            let currentPg = 1;
            let isRendering = false;
            function renderPdfPage(pageNumber) {
                if (!pdfDoc || isRendering) return;
                if (pageNumber < 1) pageNumber = 1;
                if (pageNumber > pdfDoc.numPages) pageNumber = pdfDoc.numPages;
                currentPg = pageNumber;
                isRendering = true;
                document.getElementById('number').value = currentPg;
                pdfDoc.getPage(currentPg).then(page => {
                    const canvas = document.getElementById('pdf-canvas');
                    const ctx = canvas.getContext('2d');
                    const viewport = page.getViewport({ scale: 1.5 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise.then(() => {
                        isRendering = false;
                    });
                });
            }
            window.redirect = function(pg) {
                const targetPage = parseInt(pg, 10);
                if (!isNaN(targetPage)) {
                    renderPdfPage(targetPage);
                }
            };
            document.addEventListener('DOMContentLoaded', () => {
                pdfjsLib.getDocument(pdfUrl).promise
                    .then(pdf => {
                        pdfDoc = pdf;
                        renderPdfPage(currentPg);
                    })
                    .catch(err => {
                        console.error('Error loading PDF:', err);
                    });
            });
        </script>
    </head>
    <body>
        <div class="outer">
            <div class="pdf-wrapper">
                <canvas id="pdf-canvas"></canvas>
            </div>

            <div class="inner">
                <h1 onclick="redirect(parseInt(document.getElementById('number').value, 10) - 1)">&lt;</h1>
                <input id="number" type="text" value="1">
                <h1 onclick="redirect(parseInt(document.getElementById('number').value, 10) + 1)">&gt;</h1>
            </div>
            <p id="confirm" onclick="redirect(document.getElementById('number').value)">Confirm</p>
        </div>
    </body>
</html>
